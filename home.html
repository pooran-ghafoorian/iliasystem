<style>
  .container_{
    display: grid;
    grid-template-areas: 
    "h h h h"
    "b1 b2 b3 b3"
    ;
    gap: 5px;
    height: 300px;
  }
.item1_{
  grid-area: h;
}
.item2_{
  grid-area: b1;

}
.item3_{
  grid-area: b2;

}
.item4_{
  grid-area: b3;

}
.item{
  border: 1px solid red;
}
@media screen and (max-width: 425px){
  .item1_{
    display: none;
  }
  .container_{
    grid-template-areas: 
    "b1"
    "b2"
    "b3"
    ;
  }
}
.box{
  background-color: aqua;
  width: 100px;
  height: 50px;
  /* transform: skew(10deg,5deg) */
  overflow:scroll;
}
.a{
  width: 130px;
  background-color: blueviolet;
}
.anime{
  background-color: blue;
  height: 20px;
  width: 10px;
  margin-left: 20px;
  animation-name: x;
  animation-duration: 5s;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
  /* animation-iteration-count: infinite;  */
  animation-delay: 2s;
  
}
button span{
  background-color: rgba(255, 238, 0, 0.753);
  border-radius: 50%;
  position: absolute;
  top: 100px;

}

@keyframes x {
  form {width: 10px;}
  to {width: 150px;}
}
</style>
