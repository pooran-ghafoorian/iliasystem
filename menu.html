<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
</head>
<style>
    ul {
        padding: 0px;
    }

    li {
        list-style: none;
    }

    .item {
        display: inline-block;
        margin-left: 15px;
    }

    .item:hover {
        color: #f2c418;
    }

    .submenu {
        display: none;
        position: absolute;
        top: 25px;
        /* border: 1px solid rgb(179, 179, 179); */
        box-shadow: 2px 1px 11px gray;
        padding: 10px;
        border-radius: 10px;
    }

    .item2:hover .submenu {
        display: block;
    }

    .item2 {
        position: relative;
    }
</style>

<body dir="rtl">
    <ul>
        <li class="item">صفحه اصلی</li>
        <li class="item item2">دوره های آموزشی
            <ul class="submenu">
                <li >دوره جامع</li>
                <li >دوره کامپیوتر</li>
                <li >دوره فتوشاپ</li>
            </ul>
        </li>
        <li class="item">آزمون ها</li>
        <li class="item">مقالات</li>
        <li class="item">تماس با ما</li>
    </ul>
</body>

</html>
